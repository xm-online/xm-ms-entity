# ===================================================================
# Spring Boot configuration.
#
# This configuration will be overridden by the Spring profile you use,
# for example application-dev.yml if you use the "dev" profile.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
# ===================================================================

management:
    tracing:
        export:
            enabled: ${MANAGEMENT_TRACING_EXPORT_ENABLED:false}
    otlp:
        metrics:
            export:
                enabled: ${MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED:false}
    endpoints:
        web:
            base-path: /management
            exposure:
                include: ["configprops", "env", "health", "info", "threaddump", "logfile", "jhimetrics", "jhiopenapigroups", "prometheus", "metrics"]
    endpoint:
        health:
            show-details: when_authorized
            probes:
                enabled: true
            group:
                liveness:
                    include: livenessState
                readiness:
                    include: readinessState
    info:
        git:
            mode: full
    health:
        mail:
            enabled: false # When using the MailService, configure an SMTP server and set this to true
        elasticsearch:
            enabled: false
    metrics:
        distribution:
            percentiles-histogram:
                http: true
                jvm: true
                logback: true
                process: true
                system: true
                disk: true
        enable:
            http: true
            jvm: true
            logback: true
            process: true
            system: true
    prometheus:
        metrics:
            export:
                enabled: true
                step: 60

spring:
    application:
        name: entity
    profiles:
        include: swagger
    main:
      allow-bean-definition-overriding: true
    cloud:
        inetutils:
            preferredNetworks:
                - 192.168.
                - 10.
        consul:
            discovery:
                query-passing: true
                healthCheckPath: /management/health
                instanceId: ${spring.application.name}:${spring.application.instance-id:${random.value}}
            config:
                watch:
                    enabled: false
        stream:
            kafka:
                binder:
                    health-timeout: 5 # kafkaHealthCheck timeout when scheduler-enabled: true, in seconds
    jackson:
        serialization:
            INDENT_OUTPUT: true
        default-property-inclusion: non_empty
        mapper:
            sort-properties-alphabetically: false # disable(SORT_PROPERTIES_ALPHABETICALLY)
    jpa:
        open-in-view: false
        properties:
            hibernate.jdbc.time_zone: UTC
            hibernate.query.hql.json_functions_enabled: true
            hibernate.show_sql: true
            hibernate.format_sql: false
        hibernate:
            ddl-auto: none
            naming:
                physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
                implicit-strategy: org.springframework.boot.hibernate.SpringImplicitNamingStrategy
    messages:
        basename: i18n/messages
    mvc:
        pathmatch:
            matching-strategy: ANT_PATH_MATCHER
    thymeleaf:
        mode: XHTML
    servlet:
        multipart:
            enabled: true
            max-file-size: ${application.maxUploadFileSize:20MB}
            max-request-size: ${application.maxUploadSize:20MB}
    kafka:
        consumer:
            group-id: entity
            key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
            value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        listener:
            concurrency: 16
        producer:
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: org.apache.kafka.common.serialization.StringSerializer
        # Kafka connection by environment variables, PLAINTEXT when not set: https://github.com/xm-online/xm-ms-template/blob/main/README.md#kafka-connection
        properties:
            security.protocol: PLAINTEXT # SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL=SASL_PLAINTEXT, protocol to the brokers: PLAINTEXT, SASL_PLAINTEXT, SSL, SASL_SSL; empty is not allowed
            sasl.mechanism: # SPRING_KAFKA_PROPERTIES_SASL_MECHANISM=SCRAM-SHA-512, SASL mechanism: PLAIN, SCRAM-SHA-256, SCRAM-SHA-512
            # sasl.jaas.config: # SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG=org.apache.kafka.common.security.scram.ScramLoginModule required username="user" password="secret";, SASL login and password
            # ssl.endpoint.identification.algorithm: # SPRING_KAFKA_PROPERTIES_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM=https, check of the broker host name in its certificate, https when not set; empty switches the check off
            # OAUTHBEARER (SPRING_KAFKA_PROPERTIES_SASL_MECHANISM=OAUTHBEARER, SASL_JAAS_CONFIG with org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required clientId="id" clientSecret="secret";, SASL_LOGIN_CALLBACK_HANDLER_CLASS below, JAVA_TOOL_OPTIONS=-Dorg.apache.kafka.sasl.oauthbearer.allowed.urls=https://idp/oauth/token, URLs Kafka 4 may open: the token URL and the JWKS URL when set):
            sasl.oauthbearer.token.endpoint.url: # SPRING_KAFKA_PROPERTIES_SASL_OAUTHBEARER_TOKEN_ENDPOINT_URL=https://idp/oauth/token, where the client gets the token
            # sasl.oauthbearer.jwks.endpoint.url: # SPRING_KAFKA_PROPERTIES_SASL_OAUTHBEARER_JWKS_ENDPOINT_URL=https://idp/oauth/jwks, keys to validate the token, when the client validates it; empty breaks OAUTHBEARER
            # sasl.oauthbearer.scope.claim.name: # SPRING_KAFKA_PROPERTIES_SASL_OAUTHBEARER_SCOPE_CLAIM_NAME=scope, claim of the scope in the token, scope when not set
            # sasl.oauthbearer.sub.claim.name: # SPRING_KAFKA_PROPERTIES_SASL_OAUTHBEARER_SUB_CLAIM_NAME=sub, claim of the principal in the token, sub when not set
            # sasl.login.callback.handler.class: # SPRING_KAFKA_PROPERTIES_SASL_LOGIN_CALLBACK_HANDLER_CLASS=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginCallbackHandler, gets the token for OAUTHBEARER, required for OAUTHBEARER
            # sasl.client.callback.handler.class: # SPRING_KAFKA_PROPERTIES_SASL_CLIENT_CALLBACK_HANDLER_CLASS=com.example.CustomClientCallbackHandler, custom SASL client callback handler
            # sasl.login.class: # SPRING_KAFKA_PROPERTIES_SASL_LOGIN_CLASS=org.apache.kafka.common.security.oauthbearer.internals.OAuthBearerRefreshingLogin, custom login class
            # sasl.login.connect.timeout.ms: # SPRING_KAFKA_PROPERTIES_SASL_LOGIN_CONNECT_TIMEOUT_MS=10000, connect timeout to the token endpoint
            # sasl.login.read.timeout.ms: # SPRING_KAFKA_PROPERTIES_SASL_LOGIN_READ_TIMEOUT_MS=10000, read timeout from the token endpoint
            # GSSAPI (SPRING_KAFKA_PROPERTIES_SASL_MECHANISM=GSSAPI, SASL_JAAS_CONFIG with com.sun.security.auth.module.Krb5LoginModule required useKeyTab=true keyTab="/etc/kafka.keytab" principal="entity@REALM";):
            sasl.kerberos.service.name: # SPRING_KAFKA_PROPERTIES_SASL_KERBEROS_SERVICE_NAME=kafka, Kerberos principal name of the broker
        ssl: # the commented out properties break SSL when empty, set them by the environment variables when needed
            trust-store-location: # SPRING_KAFKA_SSL_TRUST_STORE_LOCATION=file:/certs/ca.p12, CA of the broker certificate, for SSL and SASL_SSL
            # trust-store-password: # SPRING_KAFKA_SSL_TRUST_STORE_PASSWORD=changeit, password of the trust store
            # trust-store-type: # SPRING_KAFKA_SSL_TRUST_STORE_TYPE=PKCS12, type of the trust store: PKCS12, JKS, PEM
            key-store-location: # SPRING_KAFKA_SSL_KEY_STORE_LOCATION=file:/certs/entity.p12, client certificate, for SSL and SASL_SSL
            # key-store-password: # SPRING_KAFKA_SSL_KEY_STORE_PASSWORD=changeit, password of the key store file
            # key-store-type: # SPRING_KAFKA_SSL_KEY_STORE_TYPE=PKCS12, type of the key store: PKCS12, JKS, PEM
            # key-password: # SPRING_KAFKA_SSL_KEY_PASSWORD=changeit, password of the private key, when it differs from the key store password
            # protocol: # SPRING_KAFKA_SSL_PROTOCOL=TLSv1.3, TLS protocol, Kafka default when not set
            bundle: # SPRING_KAFKA_SSL_BUNDLE=kafka, name of a spring.ssl.bundle instead of the key store and trust store above
            # PEM instead of the store files above:
            # key-store-certificate-chain: # SPRING_KAFKA_SSL_KEY_STORE_CERTIFICATE_CHAIN=-----BEGIN CERTIFICATE-----..., client certificate chain in PEM, with SPRING_KAFKA_SSL_KEY_STORE_TYPE=PEM
            # key-store-key: # SPRING_KAFKA_SSL_KEY_STORE_KEY=-----BEGIN PRIVATE KEY-----..., client private key in PEM, with SPRING_KAFKA_SSL_KEY_STORE_TYPE=PEM
            # trust-store-certificates: # SPRING_KAFKA_SSL_TRUST_STORE_CERTIFICATES=-----BEGIN CERTIFICATE-----..., CA certificates in PEM, with SPRING_KAFKA_SSL_TRUST_STORE_TYPE=PEM
    # the bundle of spring.kafka.ssl.bundle, SPRING_SSL_BUNDLE_JKS_KAFKA_*; empty values break the bundle, set them by the environment variables when needed:
    # ssl:
    #     bundle.jks.kafka.truststore.location: # SPRING_SSL_BUNDLE_JKS_KAFKA_TRUSTSTORE_LOCATION=file:/certs/ca.p12, CA of the broker certificate
    #     bundle.jks.kafka.truststore.password: # SPRING_SSL_BUNDLE_JKS_KAFKA_TRUSTSTORE_PASSWORD=changeit, password of the trust store
    #     bundle.jks.kafka.truststore.type: # SPRING_SSL_BUNDLE_JKS_KAFKA_TRUSTSTORE_TYPE=PKCS12, type of the trust store
    #     bundle.jks.kafka.keystore.location: # SPRING_SSL_BUNDLE_JKS_KAFKA_KEYSTORE_LOCATION=file:/certs/entity.p12, client certificate
    #     bundle.jks.kafka.keystore.password: # SPRING_SSL_BUNDLE_JKS_KAFKA_KEYSTORE_PASSWORD=changeit, password of the key store
    #     bundle.jks.kafka.keystore.type: # SPRING_SSL_BUNDLE_JKS_KAFKA_KEYSTORE_TYPE=PKCS12, type of the key store
    mail:
        host: localhost
        port: 25
        protocol: smtp
        properties:
            mail:
                smtp:
                    starttls.enable: false
                    auth: false
                    starttls.required: false
    liquibase:
        default-schema: XM
        change-log: classpath:config/liquibase/master.xml
server:
    servlet:
        session:
            cookie:
                http-only: true

# Properties to be exposed on the /info management endpoint
info:
    # Comma separated list of profiles that will trigger the ribbon to show
    display-ribbon-on-profiles: "dev"

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================

jhipster:
    clientApp:
        name: 'entityApp'
    async:
        core-pool-size: 2
        max-pool-size: 50
        queue-capacity: 10000
    # By default CORS is disabled. Uncomment to enable.
    #cors:
        #allowed-origins: "*"
        #allowed-methods: "*"
        #allowed-headers: "*"
        #exposed-headers: "Authorization,Link,X-Total-Count"
        #allow-credentials: true
        #max-age: 1800
    api-docs:
        default-include-pattern: ${server.servlet.context-path:}/api/**
        management-include-pattern: ${server.servlet.context-path:}/management/**
        title: Entity API
        description: Entity API documentation
    mail:
        from: entity@localhost
    security:
        content-security-policy: "default-src 'self'; frame-src 'self' data:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://storage.googleapis.com; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com data:"

# ===================================================================
# Application specific properties
# Add your own application properties here, see the ApplicationProperties class
# to have type-safe configuration, like in the JHipsterProperties above
#
# More documentation is available at:
# https://www.jhipster.tech/common-application-properties/
# ===================================================================
xm-config:
    enabled: true
    xm-config-url: http://config
    kafka-config-topic: config_topic

application:
    elastic-enabled: false
    # true: attachment content is read and deleted only inside the current tenant S3 bucket and file storage folder
    secure-attachment-tenant-access: true
    # true: a client can not set a file storage content url; deletion and download link use the storage of the attachment spec
    secure-attachment-content-url: true
    # true: a parameter of an elasticsearch search template is escaped, a client can not add a query syntax with it
    secure-search-template-params: true
    # true: a client can not change the avatar url of an xmEntity on create/update, the stored value is kept
    secure-avatar-url: true
    dynamic-permission-check:
        enabled: false
    jpa:
        findOneByIdForUpdateTimeout: 10000
    timeline-ignored-http-methods:
    scheduler-enabled: false
    tenant-ignored-path-list: /v3/api-docs, /api/profile-info, /swagger-resources/configuration/ui, /management/health, /management/health/liveness, /management/health/readiness
    timelines-enabled: true
    kafka-enabled: true
    tenant-with-creation-access-list: XM, MANAGER
    tenant-create-service-list: uaa, gate, timeline, entity, dashboard, balance, scheduler
    tenant-client-connection-timeout: 2000
    tenant-client-read-timeout: 40000
    email-path-pattern: /config/tenants/{tenantName}/entity/emails/{langKey}/{fileName}.ftl
    webapp-name: webapp
    permission-context-uri: uaa/api/account
    specification-webapp-name: settings-public.yml
    specification-name: xmentityspec.yml
    specification-folder-path-pattern: /config/tenants/{tenantName}/entity/xmentityspec/*.yml
    specification-path-pattern: /config/tenants/{tenantName}/entity/${application.specification-name}
    specification-templates-name: search-templates.yml
    specification-templates-path-pattern: /config/tenants/{tenantName}/entity/${application.specification-templates-name}
    kafka-system-topic: system_topic
    kafka-system-queue: system_queue
    auto-system-queue-enabled: false
    kafka-metadata-max-age: 60000 #in milliseconds
    db-schema-suffix:
    retry:
        max-attempts: 3
        delay: 1000 #in milliseconds
        multiplier: 2
    lep:
        tenant-script-storage: XM_MS_CONFIG
        lep-resource-path-pattern: /config/tenants/{tenantName}/entity/lep/resources/**/*
        tenants-with-lep-warmup: XM
    objectStorage:
        storageType: DB
        # Max width
        maxImageSize: 100
        # Max file size 1024 * 32
        max-size: 32767
        # used for FILE strategy FILE://{objectId}
        file-root: /home/xme
        avatar-url-db-prefix-enabled: false
    avatar-default:
        default-avatar-url: /assets/img/anonymous.png
        default-avatar-url-prefix: http://xm-avatar.rgw.icthh.test:7480
        max-avatar-size: 1048576
    amazon:
        avatar:
            # XmEntity.avatarUrl should match this pattern to persist only last part into DB, otherwise set to null
            # Before persisting only last part of the URL (aka fileName) will be persisted
            pre-persist-url-full-pattern: ^http(s)?:\/\/[a-zA-Z0-9-.]+[.]icthh[.][a-z]+(:\d+)?/[a-zA-Z0-9-.]+$
            # XmEntity.avatarUrl should match this pattern to return from DB, otherwise set to null
            # After retrieving from DB URL will be prepended with path prefix to be absolute.
            post-load-url-part-pattern: ^[a-zA-Z0-9-.]+$
        aws:
            endpoint:
            template:
            region:
            access-key-id:
            access-key-secret:
        s3:
            bucket:
            bucket-prefix:
    elasticSchemaSuffix: ""
    elasticBatchSize: 100
    requestCacheIgnoredPathPatternList: /api/functions/*/upload
    periodicMetricPoolSize: 1
    kafkaMetric:
        enabled: true
        connectionTimeoutTopic: 1000
        metricTopics: system_topic
    domain-event:
        enabled: true
    api-docs:
        privilege-check: true
    config-private-key: # APPLICATION_CONFIG_PRIVATE_KEY=MC4CAQAwBQYDK2Vw..., base64 Ed25519 private key (PKCS#8 DER) to read the configuration from xm-ms-config, not needed with the profile migration

# ===================================================================
# Timeline specific properties
#
#    Example:
# mask-rules: # rule for masking data in request/response (e.g. image content)
#   - endpoint-to-mask: /api/attachments # endpoint to mask
#     http-method: POST, PUT # list of http methods of endpoint
#     path-to-mask: $.content.value # list of json-path variables to mask
#     mask: <bytes[]> # replacement string
#     mask-request: true # apply mask to request body
#     mask-response: true # apply mask to response body
#
# ===================================================================
timelines:
    mask-rules:
        - endpoint-to-mask: /api/attachments
          http-method: POST, PUT
          path-to-mask: $.content.value
          mask: <bytes[]>
          mask-request: true
          mask-response: true
        - endpoint-to-mask: /api/attachments/*
          http-method: GET
          path-to-mask: $.content.value
          mask: <bytes[]>
          mask-response: true
        - endpoint-to-mask: /api/xm-entity-specs
          http-method: GET
          path-to-mask: $.[*]
          mask: SPECS
          mask-response: true
        - endpoint-to-mask: /api/contents
          http-method: POST, PUT
          path-to-mask: $.value
          mask: <bytes[]>
          mask-request: true
          mask-response: true
        - endpoint-to-mask: /api/contents
          http-method: GET
          path-to-mask: $.[*].value
          mask: <bytes[]>
          mask-response: true
        - endpoint-to-mask: /api/contents/*
          http-method: GET
          path-to-mask: $.value
          mask: <bytes[]>
          mask-response: true

gracefulShutdown:
    enabled: false
    shutdownDelay:

